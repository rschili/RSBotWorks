name: docker-publish

# Builds and publishes both bot images to GHCR.
# Replaces the old push_wernstrom.sh / push_stoll.sh scripts.
#
# Triggers:
#   - push to main            -> builds + pushes :latest
#   - version tags (v*)       -> builds + pushes :<tag> and :latest
#   - manual workflow_dispatch
#
# Images are published as:
#   ghcr.io/<owner>/<repo>/wernstrom:<tag>
#   ghcr.io/<owner>/<repo>/stoll:<tag>

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - bot: wernstrom
            dockerfile: src/Wernstrom/Dockerfile
          - bot: stoll
            dockerfile: src/Stoll/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.bot }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
